<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            line-height: 1.6;
            color: #1e293b;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8fafc;
        }
        .container {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 30px;
            border: 1px solid #e2e8f0;
        }
        .title {
            margin: 0 0 10px;
            font-size: 24px;
            color: #0f172a;
        }
        .subtitle {
            margin: 0 0 20px;
            color: #475569;
            font-size: 14px;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #0284c7;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin: 10px 0 20px;
        }
        .link {
            color: #0284c7;
            word-break: break-all;
            font-size: 13px;
        }
        .note {
            font-size: 13px;
            color: #64748b;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Verify your email address</h1>
        <p class="subtitle">
            Confirm your email to secure your account and enable important account notifications.
        </p>

        <a href="{{VERIFY_LINK}}" class="button">Verify Email</a>

        <p class="subtitle">If the button does not work, use this link:</p>
        <p><a class="link" href="{{VERIFY_LINK}}">{{VERIFY_LINK}}</a></p>

        <p class="note">
            This link expires in 24 hours. If you did not create this account, you can ignore this email.
        </p>
    </div>
</body>
</html>
